[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whipit"
dynamic = ["version"]
description = "AccurateRip + MusicBrainz Archival CD Ripper & Opus Transcoder"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
]
audit = [
    "mypy>=1.8",
    "coverage>=7.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "ruff>=0.1.0",
]

[project.scripts]
whipit = "whipit.ui.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "whipit.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["whipit*"]
exclude = ["whipit.tests*"]

[tool.setuptools.package-data]
whipit = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["whipit/tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"whipit/tests/*" = ["S", "DTZ", "B", "RUF012"]
"whipit/config.py" = ["F401", "E402"]
"whipit/ripping/calibration.py" = ["F401"]
"whipit/validation/flac.py" = ["F401"]
"whipit/workflow.py" = ["F401"]

[tool.coverage.run]
source = ["whipit"]
branch = true
omit = ["whipit/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["whipit/tests"]
